# Run with:  docker compose up -d --build   →  http://localhost:8766
# Change the published port with:  PORT=9000 docker compose up -d
services:
  app:
    build: .
    image: ip-learning-app:latest
    ports:
      - "${PORT:-8766}:8766"
    restart: unless-stopped
    # Stateless (progress lives in each visitor's browser) → no volume.
    # Visitors run JavaScript in the app, so keep the container locked down:
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64
